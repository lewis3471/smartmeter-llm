name: Smartmeter LLM Nulleinspeisung
version: "1.8.2"
slug: smartmeter_llm
description: >-
  ESP32-Cam liest den Stromzähler (lokales OCR + Gemini-Fallback),
  regelt den Hoymiles-Inverter via OpenDTU auf Nulleinspeisung
url: https://github.com/lewis3471/smartmeter-llm
arch:
  - amd64
  - aarch64
init: false
# Schaltet die Steckdose des Wechselrichters ueber die HA-API
homeassistant_api: true
startup: application
boot: auto
services:
  - mqtt:want
options:
  gemini_api_keys: ""
  gemini_models: gemini-flash-lite-latest,gemini-flash-latest,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-2.0-flash-lite
  esphome_host: 192.168.178.58
  esphome_api_key: ""
  opendtu_url: http://192.168.178.42
  opendtu_user: admin
  opendtu_pass: ""
  inverter_serial: 1164a00ab8d4
  target_grid_w: 20
  target_grid_full_w: -50
  deadband_w: 15
  latency_s: 0
  max_limit_w: 2000
  sustain_floor_w: 430
  low_points: "300:160"
  failsafe_limit_w: 51
  batt_strings: ""
  batt_low_v: 51.2
  batt_high_v: 54.4
  batt_capacity_kwh: 0.0
  # --- AC-seitiger Tiefentladeschutz (ac_switch_entity leer = Feature aus) ---
  ac_switch_entity: ""
  ac_power_entity: ""
  ac_deadman_switch_entity: ""
  ac_deadman_number_entity: ""
  ac_deadman_at_entity: ""
  batt_mqtt_prefix: solar/
  batt_capacity_ah: 0
  batt_current_charge_positive: true
  ac_throttle_cell_mv: 3120
  ac_off_cell_mv: 3050
  ac_off_soc: 18
  ac_hard_cell_mv: 2900
  ac_on_cell_mv: 3300
  ac_on_soc: 50
  ac_on_diff_max_mv: 0
  ac_off_min_s: 2700
  ac_max_switch_per_day: 6
  ac_start_blind_s: 180
  ac_deadman_s: 900
  ac_automatik: true
  deye_host: ""
  deye_user: admin
  deye_pass: admin
  deye_logger_sn: ""
  deye_slave: 170
  log_level: error
  save_samples: true
  git_sync_enabled: false
  git_repository: ""
  git_branch: main
  git_deploy_key_base64: ""
  git_sync_interval_s: 300
schema:
  gemini_api_keys: str
  gemini_models: str
  esphome_host: str
  esphome_api_key: str
  opendtu_url: str
  opendtu_user: str
  opendtu_pass: password
  inverter_serial: str
  target_grid_w: int(-800,1000)
  target_grid_full_w: int(-800,1000)
  deadband_w: int(0,500)
  latency_s: float(0,60)
  max_limit_w: int(50,2000)
  sustain_floor_w: int(0,2000)
  low_points: str?
  failsafe_limit_w: int(0,2000)
  batt_strings: str
  batt_low_v: float(10,60)
  batt_high_v: float(10,60)
  batt_capacity_kwh: float(0,200)
  ac_switch_entity: str?
  ac_power_entity: str?
  ac_deadman_switch_entity: str?
  ac_deadman_number_entity: str?
  ac_deadman_at_entity: str?
  batt_mqtt_prefix: str
  batt_capacity_ah: int(0,2000)
  batt_current_charge_positive: bool
  ac_throttle_cell_mv: int(2700,3400)
  ac_off_cell_mv: int(2700,3400)
  ac_off_soc: int(0,100)
  ac_hard_cell_mv: int(2500,3200)
  ac_on_cell_mv: int(3000,3600)
  ac_on_soc: int(0,100)
  ac_on_diff_max_mv: int(0,800)
  ac_off_min_s: int(300,86400)
  ac_max_switch_per_day: int(1,20)
  ac_start_blind_s: int(30,900)
  ac_deadman_s: int(120,7200)
  ac_automatik: bool
  deye_host: str?
  deye_user: str?
  deye_pass: password?
  deye_logger_sn: str?
  deye_slave: int(1,247)?
  log_level: list(all|error|none)
  save_samples: bool
  git_sync_enabled: bool
  git_repository: str
  git_branch: str
  git_deploy_key_base64: password
  git_sync_interval_s: int(10,3600)
